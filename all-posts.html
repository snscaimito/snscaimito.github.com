---
layout: special
title: All Posts On Stephan Schwab's Blog
---
<table>
{% for post in site.posts %}
{% if post.lang == nil or post.lang == 'en' %}
<tr>
	<td nowrap>{{ post.date | date: "%d %b %Y" }}</td>
	<td><a href="{{ post.url }}">{{ post.title }}</a></td>
</tr>
{% endif %}
{% endfor %}
</table>
