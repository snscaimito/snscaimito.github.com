name: Stephan Schwab
description: As International Software Development Coach and Trainer I offer to CEOs and Department Leaders technical and organizational team coaching as a professional service to improve the value creation chain within their organization and to improve the quality of the product they are making.
url: http://www.stephan-schwab.com

highlighter: rouge
permalink: /:year/:month/:day/:title.html
markdown: kramdown
encoding: UTF-8
future: false
show_drafts: false
unpublished: false

collections:
  topics:
    output: true
    permalink: /topics/:name/

plugins:
  - jekyll-redirect-from

exclude:
  - .bundle
  - .x-publisher
  - .env
  - .env.*
  - node_modules
  - runLocally.sh
  - TODO.txt
  - _tools
  - _planning
  - vendor
  - AGENTS.md
  - design.md
  - Gemfile
  - Gemfile.lock
  - serve.sh
  - elements.md
  # Illustrations for an unpublished story, including full-size copies.
  - img/the-common-granary
  # Queued Why My Income? installment; preserve Maya's published images.
  - img/why-my-income/britain-1799-private-accounts.jpeg
  - img/why-my-income/full/britain-1799-private-accounts.jpeg
