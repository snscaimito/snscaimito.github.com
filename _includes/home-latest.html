<section class="home-latest no-print">

	<div class="home-stories">
		<div class="stories-row">
			{% for post in site.posts %}
			{% if post.lang == nil or post.lang == 'en' %}
			{% assign thumb = post.image %}
			{% if thumb == nil or thumb == "" %}
			{% assign image_markup = post.content | split: '<img ' | slice: 1, 1 | first %}
			{% if image_markup contains 'src="' %}
			{% assign thumb = image_markup | split: 'src="' | slice: 1, 1 | first | split: '"' | first %}
			{% endif %}
			{% endif %}
			{% if thumb and thumb != "" %}
			{% assign thumb_first = thumb | slice: 0, 1 %}
			{% if thumb contains '://' %}
			{% assign thumb_url = thumb %}
			{% elsif thumb_first == '/' %}
			{% assign thumb_url = thumb %}
			{% elsif thumb contains 'img/' %}
			{% assign thumb_url = '/' | append: thumb %}
			{% else %}
			{% assign thumb_url = '/img/posts/' | append: thumb %}
			{% endif %}
			<a class="story-card" href="{{ post.url }}">
				<span class="story-card-thumb">
					<img src="{{ thumb_url }}" alt="{{ post.title | escape }}" loading="lazy" />
				</span>
				<span class="story-card-body">
					<span class="story-card-title">{{ post.title }}</span>
					<span class="story-card-date">{{ post.date | date: "%d %b %Y" }}</span>
				</span>
			</a>
			{% endif %}
			{% endif %}
			{% endfor %}
		</div>
	</div>
</section>
