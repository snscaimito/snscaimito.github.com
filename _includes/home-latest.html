<section class="home-latest home-band no-print" aria-labelledby="home-latest-title">
	<h2 id="home-latest-title" class="home-band-title">When power and technology reach into everyday life.</h2>

	<ul class="home-card-list">
			{% assign featured_post_count = 0 %}
			{% for post in site.posts %}
			{% if post.lang == nil or post.lang == 'en' %}
			{% assign thumb = post.image %}
			{% if thumb == nil or thumb == "" %}
			{% assign image_markup = post.content | split: '<img ' | slice: 1, 1 | first %}
			{% if image_markup contains 'src="' %}
			{% assign thumb = image_markup | split: 'src="' | slice: 1, 1 | first | split: '"' | first %}
			{% endif %}
			{% endif %}
			{% if thumb and thumb != "" %}
			{% assign thumb_first = thumb | slice: 0, 1 %}
			{% if thumb contains '://' %}
			{% assign thumb_url = thumb %}
			{% elsif thumb_first == '/' %}
			{% assign thumb_url = thumb %}
			{% elsif thumb contains 'img/' %}
			{% assign thumb_url = '/' | append: thumb %}
			{% else %}
			{% assign thumb_url = '/img/posts/' | append: thumb %}
			{% endif %}
			{% assign post_meta = post.date | date: "%d %b %Y" %}
			{% assign post_image_alt = post.image_alt | default: '' %}
			{% include home-card.html title=post.title url=post.url image=thumb_url image_alt=post_image_alt meta=post_meta %}
			{% assign featured_post_count = featured_post_count | plus: 1 %}
			{% if featured_post_count == 4 %}{% break %}{% endif %}
			{% endif %}
			{% endif %}
			{% endfor %}
	</ul>
</section>
